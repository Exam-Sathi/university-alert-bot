name: University Notice Auto-Poster

on:
  schedule:
    - cron: '*/30 * * * *'  # हर 30 मिनट में ऑटोमैटिक चलेगा
  workflow_dispatch:        # जब आप चाहें तब 'Run' बटन दबाकर भी टेस्ट कर सकते हैं

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Scraper & Poster
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BLOGGER_EMAIL: ${{ secrets.BLOGGER_EMAIL }}
          SENDER_GMAIL: ${{ secrets.SENDER_GMAIL }}
          GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python auto_poster.py

      - name: Commit Updated History
        run: |
          git config --global user.name "AutoBot"
          git config --global user.email "bot@examsathi.com"
          git add posted_notices.json || true
          git commit -m "Updated notice history [skip ci]" || true
          git push || true
