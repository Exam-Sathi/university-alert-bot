name: University Notice Auto-Poster

on:
  schedule:
    - cron: '*/30 * * * *'  # हर 30 मिनट में खुद चलेगा
  workflow_dispatch:        # जब चाहें 'Run' बटन दबाएं

# यह लाइन GitHub Actions को खुद राइट (Write) परमिशन दे देती है
permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Scraper & Poster
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BLOGGER_EMAIL: ${{ secrets.BLOGGER_EMAIL }}
          SENDER_GMAIL: ${{ secrets.SENDER_GMAIL }}
          GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python auto_poster.py

      - name: Save History to Prevent Duplicates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add posted_notices.json
          git commit -m "Updated notice history [skip ci]" || echo "No changes to commit"
          git push origin main || echo "Push skipped"
